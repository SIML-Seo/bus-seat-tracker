# 버스 데이터 수집 GitHub Actions 워크플로우
# 직접 스크립트 실행 방식으로 데이터를 수집합니다.

name: Collect Bus Data

on:
  schedule:
    # 평일 출퇴근 시간 (5분 간격)
    # UTC 기준이므로 한국시간 -9시간
    # 한국시간 07:00-09:00 = UTC 22:00-00:00 (전날), UTC 22:00-00:00
    - cron: '*/5 22-23 * * 0-4'  # 일-목 22:00-23:59 UTC = 월-금 07:00-08:59 KST
    - cron: '*/5 0 * * 1-5'      # 월-금 00:00-00:59 UTC = 월-금 09:00-09:59 KST (출근 마무리)

    # 한국시간 17:30-19:30 = UTC 08:30-10:30
    - cron: '30-59/5 8 * * 1-5'  # 월-금 08:30-08:59 UTC = 월-금 17:30-17:59 KST
    - cron: '*/5 9 * * 1-5'      # 월-금 09:00-09:59 UTC = 월-금 18:00-18:59 KST
    - cron: '0-30/5 10 * * 1-5'  # 월-금 10:00-10:30 UTC = 월-금 19:00-19:30 KST

    # 평일 일반 시간 (15분 간격)
    # 한국시간 06:00-07:00, 09:00-17:30, 19:30-22:00
    - cron: '*/15 21 * * 0-4'    # 일-목 21:00-21:59 UTC = 월-금 06:00-06:59 KST
    - cron: '*/15 1-7 * * 1-5'   # 월-금 01:00-07:59 UTC = 월-금 10:00-16:59 KST
    - cron: '*/15 8 * * 1-5'     # 월-금 08:00-08:29 UTC = 월-금 17:00-17:29 KST (퇴근 전)
    - cron: '*/15 11-12 * * 1-5' # 월-금 11:00-12:59 UTC = 월-금 20:00-21:59 KST

    # 주말 (30분 간격) - 원래 40분이지만 cron은 30분이 더 깔끔
    # 한국시간 06:00-22:00 = UTC 21:00-13:00
    - cron: '*/30 21-23 * * 5'   # 금 21:00-23:59 UTC = 토 06:00-08:59 KST
    - cron: '*/30 0-12 * * 6'    # 토 00:00-12:59 UTC = 토 09:00-21:59 KST
    - cron: '*/30 21-23 * * 6'   # 토 21:00-23:59 UTC = 일 06:00-08:59 KST
    - cron: '*/30 0-12 * * 0'    # 일 00:00-12:59 UTC = 일 09:00-21:59 KST

  # 수동 실행 버튼
  workflow_dispatch:
    inputs:
      reason:
        description: '수동 실행 사유'
        required: false
        default: '테스트'

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      TZ: 'Asia/Seoul'

    steps:
      - name: 현재 시간 출력 (KST)
        run: |
          echo "🕐 현재 시간 (UTC): $(date)"
          echo "🕐 현재 시간 (KST): $(TZ='Asia/Seoul' date)"

      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: Prisma 클라이언트 생성
        run: npx prisma generate

      - name: 데이터 수집 실행
        id: collect
        run: |
          echo "📡 버스 데이터 수집 시작..."
          npx tsx scripts/collectBusData.ts --single-run
          echo "✅ 데이터 수집 완료"

      - name: 실패 시 Slack 알림 (선택사항)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "⚠️ 버스 데이터 수집 실패",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*⚠️ 버스 데이터 수집 실패*\n시간: '"$(TZ='Asia/Seoul' date)"'"
                  }
                }
              ]
            }'
